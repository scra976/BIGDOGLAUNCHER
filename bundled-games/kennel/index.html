<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kennel</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f4f1ea;
        background:
          radial-gradient(800px 400px at 50% -10%, rgba(232,185,35,.16), transparent 55%),
          #0a090c;
      }
      header { padding: 22px 28px 8px; letter-spacing: .22em; color: #e8b923; font-size: 12px; font-weight: 700; }
      main { display: grid; place-items: center; padding: 8px 20px 40px; }
      .stage {
        width: min(720px, 100%);
        background: #141218;
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0,0,0,.45);
      }
      .art { position: relative; cursor: pointer; }
      .art img { width: 100%; height: 360px; object-fit: cover; display: block; }
      .float {
        position: absolute; left: 50%; top: 40%;
        transform: translate(-50%, -50%);
        color: #f3d36a; font-weight: 800; font-size: 28px;
        opacity: 0; pointer-events: none;
      }
      .art.pop .float { animation: pop .7s ease forwards; }
      @keyframes pop {
        0% { opacity: 0; transform: translate(-50%, -20%); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -90%); }
      }
      .hud { padding: 18px 20px 22px; }
      h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.03em; }
      p { margin: 0 0 14px; color: rgba(244,241,234,.6); }
      .stats { display: flex; gap: 16px; margin-bottom: 14px; color: #f3d36a; font-weight: 700; }
      .shop { display: grid; gap: 8px; }
      button.buy {
        display: flex; justify-content: space-between;
        width: 100%; border: 0; border-radius: 12px;
        padding: 12px 14px; background: rgba(255,255,255,.05);
        color: #f4f1ea; cursor: pointer;
      }
      button.buy:hover { background: rgba(232,185,35,.16); }
      button.buy:disabled { opacity: .4; cursor: default; }
    </style>
  </head>
  <body>
    <header>BIG DOG · HOUSE GAME</header>
    <main>
      <div class="stage">
        <div class="art" id="dog">
          <img src="./cover.jpg" alt="The house dog" />
          <div class="float" id="float">+1</div>
        </div>
        <div class="hud">
          <h1>Kennel</h1>
          <p>Pet the dog. Spend treats on a fancier life.</p>
          <div class="stats">
            <span id="treats">0 treats</span>
            <span id="rate">1 / pet</span>
          </div>
          <div class="shop" id="shop"></div>
        </div>
      </div>
    </main>
    <script>
      const KEY = "bigdog-kennel-v1";
      const upgrades = [
        { id: "pats", name: "Softer pats", cost: 15, power: 1 },
        { id: "brush", name: "Gold brush", cost: 60, power: 3 },
        { id: "steak", name: "Steak nights", cost: 200, power: 8 },
        { id: "throne", name: "Velvet throne", cost: 800, power: 25 },
      ];
      const state = Object.assign(
        { treats: 0, power: 1, bought: {} },
        JSON.parse(localStorage.getItem(KEY) || "{}")
      );
      const treatsEl = document.getElementById("treats");
      const rateEl = document.getElementById("rate");
      const shop = document.getElementById("shop");
      const dog = document.getElementById("dog");
      const floatEl = document.getElementById("float");

      function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
      function render() {
        treatsEl.textContent = Math.floor(state.treats) + " treats";
        rateEl.textContent = state.power + " / pet";
        shop.innerHTML = "";
        for (const u of upgrades) {
          const owned = state.bought[u.id] || 0;
          const cost = Math.floor(u.cost * Math.pow(1.35, owned));
          const b = document.createElement("button");
          b.className = "buy";
          b.disabled = state.treats < cost;
          b.innerHTML = `<span>${u.name} ×${owned}</span><span>${cost} treats · +${u.power}</span>`;
          b.onclick = () => {
            if (state.treats < cost) return;
            state.treats -= cost;
            state.power += u.power;
            state.bought[u.id] = owned + 1;
            save(); render();
          };
          shop.appendChild(b);
        }
      }
      dog.onclick = () => {
        state.treats += state.power;
        floatEl.textContent = "+" + state.power;
        dog.classList.remove("pop");
        void dog.offsetWidth;
        dog.classList.add("pop");
        save(); render();
      };
      render();
    </script>
  </body>
</html>
